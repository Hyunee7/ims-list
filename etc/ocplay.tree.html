<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도스 디렉토리 트리 탐색기 (범례 추가 버전)</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace, '맑은 고딕';
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
            user-select: none; /* 텍스트 드래그로 인한 탐색 방해 금지 */
        }
        h2 {
            color: #61afef;
            border-bottom: 1px solid #3e4451;
            padding-bottom: 10px;
            margin-right: 240px; /* 범례 공간 확보 */
        }
        
        /* [추가] 상단 우측 고정 범례(Legend) 스타일 */
        .legend-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #21252b;
            border: 1px solid #3e4451;
            padding: 12px 18px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.8;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .legend-title {
            font-weight: bold;
            color: #61afef;
            margin-bottom: 6px;
            border-bottom: 1px solid #3e4451;
            padding-bottom: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        .upload-box {
            border: 2px dashed #4b5263;
            padding: 30px;
            text-align: center;
            background-color: #21252b;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: border 0.3s;
            margin-right: 240px; /* 범례 공간 확보 */
        }
        .upload-box:hover {
            border-color: #61afef;
        }
        #file-input {
            display: none;
        }
        .tree-container {
            background-color: #282c34;
            border: 1px solid #3e4451;
            padding: 20px;
            border-radius: 5px;
            white-space: pre;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
        }
        /* 기본 폴더 및 루트 스타일 */
        .tree-row {
            display: block;
            outline: none;
        }
        /* 기본 폴더 및 루트 스타일 */
        .folder-item { 
            color: #d4d4d4; 
            cursor: pointer;
            /*padding: 2px 6px;*/
            border-radius: 3px;
            display: inline-block;
        }
        .folder-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .folder-icon { color: #e5c07b; margin-right: 5px; }
        .root-icon { color: #e06c75; margin-right: 5px; }
        
        /* [두 번째 비트 강조] 밝은 형광 초록색 */
        .highlight-green { color: #98c379 !important; font-weight: bold; } /* 도스 느낌의 밝은 형광 초록색 */
        .highlight-green .folder-icon { color: #a3e635 !important; }

        /* [세 번째 비트 강조] 네온 하늘색 (Cyan) */
        .highlight-cyan { color: #56b6c2 !important; font-weight: bold; }
        .highlight-cyan .folder-icon { color: #4dd0e1 !important; }

        /* [두,세 번째 비트 강조] 네온 붉색 (Red) */
        .highlight-red { color: #cb2a04 !important; font-weight: bold; }
        .highlight-red .folder-icon { color: #4dd0e1 !important; }

        /* [키보드/마우스 선택 상태 강조] 도스 포커스 스타일 */
        .selected-row .folder-item {
            background-color: #3e4451 !important;
            color: #ffffff !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 상단 우측 속성 범례 레이아웃 -->
    <div class="legend-box">
        <div class="legend-title">속성 비트 범례 (Legend)</div>
        <div class="legend-item">
            <span class="legend-color-dot" style="background-color: #98c379;"></span>
            <span class="highlight-green" style="font-size: 13px;">초록색 (Bit 6)</span> : IMS
        </div>
        <div class="legend-item">
            <span class="legend-color-dot" style="background-color: #56b6c2;"></span>
            <span class="highlight-cyan" style="font-size: 13px;">하늘색 (Bit 5)</span> : ROL
        </div>
    </div>

    <h2><button onclick="defaultFile()">📁</button> DOS 디렉토리 트리 구조 탐색기 (방향키 이동)</h2>
    
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
        OCNETREE.DIR 파일을 여기에 드래그하거나 클릭하세요.
        <input type="file" id="file-input" accept="*/*">
    </div>

    <!-- 트리가 그려질 영역 -->
    <div class="tree-container" id="tree-output">파일을 입력하면 트리 구조가 표시됩니다. (상/하: 같은깊이, 좌: 부모, 우: 자식/이웃)</div>
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const treeOutput = document.getElementById('tree-output');

        const decoder = new TextDecoder('euc-kr');
        let parsedNodes = []; 
        let selectedIndex = -1; 

        // 드래그 앤 드롭 이벤트 처리
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#61afef'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#4b5263'; });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#4b5263';
            if (e.dataTransfer.files.length > 0) {
                // 첫 번째 파일 객체(File)만 명확하게 추출하여 함수에 넘김
                processFile(e.dataTransfer.files[0]); 
            }
        });

        // 파일 직접 선택 클릭 처리
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                // 첫 번째 파일 객체(File)를 명확히 추출하여 전달 (TypeError 해결)
                processFile(e.target.files[0]); 
            }
        });
        
        // 폴더이미지 클릭시 서버의 파일을 처리함.
        async function defaultFile(){
          const url = '../dos/C_Drv/OCNETREE.DIR';
          const response = await fetch(url);
          if (!response.ok) throw new Error('네트워크 에러 : '+url);
          const buffer = new Uint8Array( await response.arrayBuffer() );
          parseTreeData(buffer);
        }

        // 파일 읽기 및 바이너리 분석
        // 단일 Blob/File 객체를 안정적으로 받아와 ArrayBuffer로 읽습니다.
        // 단일 파일 객체를 안전하게 ArrayBuffer로 전달받아 처리합니다.
        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = new Uint8Array(e.target.result);
                parseTreeData(buffer);
            };
            reader.readAsArrayBuffer(file);
        }

        // 분석 로직 및 구조화
        function parseTreeData(buffer) {
            let i = 0;
            let isStart = false;
            let isDeup = false;
            
            // 데이터 분석 기준 각 레코드의 고정 레이아웃 크기 (14바이트 규격)
            const RECORD_SIZE = 14; 
            parsedNodes = [];

            // 루트 디렉토리 기본 노드 삽입
            parsedNodes.push({ level: 0, name: "C:", isLast: false, colorType: "default", fullPath: "C:\\" });

            while (i < buffer.length) {
                // 남은 바이트가 한 레코드 크기보다 작으면 종료
                if (i + RECORD_SIZE > buffer.length) break;
                //if(isDeup) break;;

                // 14바이트 고정 레코드 (디렉토리명 13바이트 + 속성 1바이트)
                let record = buffer.subarray(i, i + RECORD_SIZE);
                let nameBytes = record.subarray(0, 13);  // 13바이트 디렉토리명 영역
                let attrByte = record[13];               // 14번째 속성 바이트

                // 속성 바이트 분석
                // 1. 첫 번째 비트(최좌측, b7 = 0x80) ➔ 마지막 항목 여부 (└──)
                let isLast = (attrByte & 0x80) === 0x80;
                
                // 2. 색상 하이라이트 타입 분류 (두 번째 비트 b6, 세 번째 비트 b5 조건 판별)
                let colorType = "default";
                if ((attrByte & 0x40) === 0x40) colorType = "green";      // 두 번째 비트 활성화 ➔ 초록색 강조
                else if ((attrByte & 0x20) === 0x20) colorType = "cyan";  // 세 번째 비트 활성화 ➔ 하늘색 강조
                
                // 3. 상위 3비트를 비트마스킹(0x1F)으로 완전히 밀어내고 남은 순수 트리 깊이(Level)값
                let level = attrByte & 0x1F; // 상위 비트 제어 플래그 보정 (84 -> 4)
                // 최상위 예외 보정
                // 일반적인 도스 트리 유효 레벨 범위 제한 (안전장치)
                // 비정상적인 레벨 값에 대한 방어 코드
                if (level === 0 || level > 20) level = 1; // 예외 보정 기본값

                // 4. [핵심 수정] 고정 바이트 내에서 Null(0x00) 직전까지만 잘라내어 CP949 디코딩 수행
                let actualNameEnd = 0;
                while (actualNameEnd < 13 && nameBytes[actualNameEnd] !== 0x00 && nameBytes[actualNameEnd] !== 0x20) {
                    actualNameEnd++;
                }
                
                let dirName = "";
                if (actualNameEnd > 0) {
                    let validNameBytes = nameBytes.subarray(0, actualNameEnd);
                    dirName = decoder.decode(validNameBytes).trim();
                }
                
                // 유효한 디렉토리 노드만 추가 (루트 중복 및 특수 경로 필터링)
                // 유효한 디렉토리 데이터만 수집
                // 유효 노드 추가 (불필요한 상대경로 필터링)
                //if (dirName && dirName !== "C:\\" && !dirName.startsWith("..") && dirName !== "." && dirName !== "C:") {
                if (dirName && dirName !== "C:\\" && dirName !== "C:") {
                    parsedNodes.push({ 
                        level: level, 
                        name: dirName, 
                        isLast: isLast,
                        colorType: colorType,
                        fullPath: ""  // 경로는 렌더링 단계에서 계층 추적하여 연산
                    });
                }
                // 다음 고정 레코드 위치로 이동
                i += RECORD_SIZE;
            }

            // 계층 추적을 통한 실시간 Full Path 생성 알고리스를 적용합니다.
            let pathStack = ["C:"];
            for (let j = 1; j < parsedNodes.length; j++) {
                let node = parsedNodes[j];
                pathStack[node.level] = node.name;
                // 현재 레벨 이하의 유효한 조상 경로들을 묶어서 fullPath 조립
                node.fullPath = pathStack.slice(0, node.level + 1).join("\\").replace("C:\\", "C:\\");
                //node.fullPath = pathStack.slice(0, node.level + 1).join("\\").replace("C:\\", "C:\\").replace(/\\\.|\\\.\./g,"");
            }

            selectedIndex = 0; // 초기 선택을 루트(C:\)로 세팅
            // HTML 화면에 그리기
            renderTree();
        }

        // 화면 렌더링 함수
        function renderTree() {
            let htmlResult = "";
            // 상위 레벨의 마지막 노드 여부를 추적하여縱선(│) 출력 제어
            let levelLastFlags = [];

            parsedNodes.forEach((item, index) => {
                let isSelected = (index === selectedIndex) ? "selected-row" : "";
                
                if(item.fullPath.indexOf('\\.')>-1) return; // \. 나 \.. 이 포함이면 처리하지 않음.
                
                if (item.level === 0) {
                    htmlResult += `<div class="tree-row ${isSelected}" data-index="${index}"><span class="folder-item"><span class="root-icon">💾</span><strong>${item.name}\\</strong></span></div>`;
                    return;
                }

                // 현재 레벨의 마지막 노드 상태 업데이트
                // 현재 탐색중인 계층의 마지막 상태를 실시간 기록
                levelLastFlags[item.level] = item.isLast;

                let indent = "    ";
                // 상위 트리들의 누적 구조선 형태에 맞춰 수직 연결선(│) 유무 동적 결정
                for (let l = 1; l < item.level; l++) {
                                                  // 상위 폴더가 마지막 노드였으면 선을 그리지 않음
                    indent += levelLastFlags[l] ? "       " : "│     ";
                                                              // 아직 하위에 항목이 더 남은 상위 폴더면 세로선 유지
                }

                // 마지막 노드 여부에 따른 기호 결정
                let connector = item.isLast ? "└── " : "├── ";
                // 하이라이트 여부에 따라 클래스를 동적으로 부여합니다.
                // 지정된 컬러 타입에 맞춰 클래스 매핑
                let colorClass = "";
                if (item.colorType === "green") colorClass = "highlight-green";
                else if (item.colorType === "cyan") colorClass = "highlight-cyan";

                htmlResult += `<div class="tree-row ${isSelected}" data-index="${index}">${indent}${connector}<span class="folder-item ${colorClass}"><span class="folder-icon">📁</span>${item.name}</span></div>`;
            });

            treeOutput.innerHTML = htmlResult;

            // 클릭 이벤트 실시간 바인딩
            document.querySelectorAll('.tree-row').forEach(row => {
                row.addEventListener('click', function() {
                    let idx = parseInt(this.getAttribute('data-index'));
                    selectNode(idx);
                });
            });
        }

        // 특정 노드를 선택하고 콘솔에 경로를 띄우는 제어 함수
        function selectNode(index) {
            if (index < 0 || index >= parsedNodes.length) return;
            selectedIndex = index;
            // 1. 트리 화면 갱신 (선택 효과 반전)
            renderTree();

            // 2. [요구사항] 콘솔에 Full 경로 출력
            console.log(`%c[FULL PATH] ${parsedNodes[selectedIndex].fullPath}`, "color: #56b6c2; font-weight: bold;");
            
            // 선택된 항목이 스크롤 화면 밖으로 나가면 자동 조절
            const activeRow = document.querySelector('.selected-row');
            if (activeRow) {
                activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // [요구사항] 키보드 화살표 방향키 이동 제어 리스너
        window.addEventListener('keydown', function(e) {
            if (parsedNodes.length === 0 || selectedIndex === -1) return;
            
            let currNode = parsedNodes[selectedIndex];

            // 1. 하 (ArrowDown): 같은 깊이(Level)의 다음 노드 찾기
            if (e.key === "ArrowDown" || e.key === "Down") {
                e.preventDefault(); // 웹 브라우저 자체 스크롤 방지
                let foundIdx = -1;
                for (let idx = selectedIndex + 1; idx < parsedNodes.length; idx++) {
                    if (parsedNodes[idx].level === currNode.level) {
                        foundIdx = idx;
                        break;
                    }
                }
                if (foundIdx !== -1) selectNode(foundIdx);
            } 
            // 2. 상 (ArrowUp): 같은 깊이(Level)의 이전 노드 찾기
            else if (e.key === "ArrowUp" || e.key === "Up") {
                e.preventDefault();
                let foundIdx = -1;
                for (let idx = selectedIndex - 1; idx >= 0; idx--) {
                    if (parsedNodes[idx].level === currNode.level) {
                        foundIdx = idx;
                        break;
                    }
                }
                if (foundIdx !== -1) selectNode(foundIdx);
            } 
            // 3. 좌 (ArrowLeft): 부모 깊이(현재 레벨 - 1) 노드 찾아 올라가기
            else if (e.key === "ArrowLeft" || e.key === "Left") {
                e.preventDefault();
                if (currNode.level > 0) {
                    let targetLevel = currNode.level - 1;
                    let foundIdx = -1;
                    for (let idx = selectedIndex - 1; idx >= 0; idx--) {
                        if (parsedNodes[idx].level === targetLevel) {
                            foundIdx = idx;
                            break;
                        }
                    }
                    if (foundIdx !== -1) selectNode(foundIdx);
                }
            } 
            // 4. 우 (ArrowRight): 자식 깊이(현재 레벨 + 1) 노드로 들어가거나, 없으면 아래 디렉토리로 이동
            else if (e.key === "ArrowRight" || e.key === "Right") {
                e.preventDefault();
                let foundIdx = -1;
                
                // 바로 다음 노드가 깊이 + 1인지 먼저 체크 (직계 자식 판별)
                if (selectedIndex + 1 < parsedNodes.length && parsedNodes[selectedIndex + 1].level === currNode.level + 1) {
                    foundIdx = selectedIndex + 1;
                }
                // 자식 노드가 없으면 다음 조건 작동: "그냥 바로 아래에 배치된 디렉토리로 이동"
                if (foundIdx === -1 && selectedIndex + 1 < parsedNodes.length) {
                    foundIdx = selectedIndex + 1;
                }
                if (foundIdx !== -1) selectNode(foundIdx);
            }
        });
    </script>
</body>
</html>
