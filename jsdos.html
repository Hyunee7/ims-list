<html lang="en">

<head>
  <meta charset="utf-8">
  <title>js-dos 6.22</title>

  <style>

    html, body, canvas, .dosbox-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /*overflow: hidden;*/
      background-color:#181818;
    }
    canvas {
    /*
        width : 640px; 
        height: 480px;
    */
        width:92%;
        /*height:92%;*/
    }

/* 세로 모드 (portrait) */
@media only screen and (orientation: portrait) {
    canvas {
        width:100%;
    }
    @media only screen and (min-device-width: 300px) and (max-device-width: 400px) {
        canvas {
            width:92%;
        }
    }
    /* 다른 세로 모드 전용 스타일 */
}

/* 가로 모드 (landscape) */
@media only screen and (orientation: landscape) {
    @media only screen and (min-device-width: 300px) and (max-device-width: 400px) {
        canvas {
            width:70%;
        }
    }
    /* 다른 가로 모드 전용 스타일 */
}


  </style>
  <script>
    var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
    var no = params && params.get("no") && decodeURIComponent(params.get("no"));
    if(no){
        var file = no.split('.')[0];
        var ntmn = no.split('.')[1];
    }

    var dos;
    var _fs;
    var _main;

    no = no||'ocplay.1234567890'
    file = file||'ocplay'

    const showMobileUrlBar = () => {
      let i = 0
      const to = setInterval(() => {
        document.body.scrollTop = -1
        // clear timeout after 250 ms and reset scrollTop to 0
        if (i++ > 25) {
          clearInterval(to)
          document.body.scrollTop = 0
        }
      }, 100)
    }

    function run(v){
      dos = Dos(document.getElementById("jsdos"), {
//        wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
        wdosboxUrl: "wdosbox.js",
        cycles: 1000,
        //cycles: "max",
        autolock: true,
        nosound:false,
      }).ready(function (fs, main) {
          _fs=fs;
          _main=fs;
       fs.extract(`zip/${no}.zip`).then(function () {
        main(["-c", `\\${file}\\play.bat`]).then(function (ci) {
//            DosController.Move(ci.getParentDiv(), ci.getKeyEventConsumer());
//            DosController.Qwerty(ci.getParentDiv(), ci.getKeyEventConsumer());
            var msg='';
            window.ci = ci;
            // 이동 컨트롤러
            //DosController.Move(ci.getParentDiv(), ci.getKeyEventConsumer());
            // 쿼티 컨트롤러
            //DosController.Qwerty(ci.getParentDiv(), ci.getKeyEventConsumer());
            //ci.api.canvas.focus();
            ci.listenStdout(function (message) {

              if(message.charCodeAt(0)==10)msg=''; // 엔터문자 이후 문자수집(트래킹?용)
              else msg+=message;
              console.log(message, message.charCodeAt(0),msg)

              if(msg.indexOf('hyunee')>-1){ // 종료
                setTimeout(function () {
                  fetch(`${file}.php?no=${ntmn}`).then(res => {
                    ci.exit();
                    history.go(-1);
                  })
                }, 1000);
              }

            });
/*
            window.ci = ci;
              setTimeout(function () {
                ci.exit();
              }, 1000)
*/

        });
       });
      });
    }
    window.onload = function(){
        run(location.href.split('?p=')[1]||'GAME');
        //jsdos.style.width='100%';
        //TweenMax.to(window, 0.5, {scrollTo: 0, onComplete: showMobileUrlBar})
        showMobileUrlBar();
    }

    let analyticsData = { no:no, file:file, ntmn:ntmn };

    window.addEventListener("unload", function() {
      navigator.sendBeacon(`${file}.php?no=${ntmn}`, JSON.stringify(analyticsData));
    });

    function keyboard(key){
        console.log('key:',key);
        //document.body.dispatchEvent(new KeyboardEvent('keydown', {'key': key}));
        jsdos.dispatchEvent(new KeyboardEvent('keydown', {'key': key}));
    }
  </script>
</head>

<body>
  <div class="mydosbox"><canvas id="jsdos" width="640px" height="480px"></canvas></div>

    <script>
        function updateViewport() {
            var viewportMeta = document.querySelector('meta[name="viewport"]');
            if (viewportMeta) {
                viewportMeta.parentNode.removeChild(viewportMeta);
            }

            var newViewport = document.createElement('meta');
            newViewport.name = "viewport";

            if (window.innerWidth > window.innerHeight) {
                // 가로 모드
                //alert('가로 모드')
                //newViewport.content = "width=device-width, initial-scale=0.5";
                showMobileUrlBar();
            } else {
                // 세로 모드
                //alert('세로 모드')
                //newViewport.content = "width=device-width, initial-scale=1.0";
            }

            document.getElementsByTagName('head')[0].appendChild(newViewport);
        }

        window.addEventListener('resize', updateViewport);
        window.addEventListener('orientationchange', updateViewport);

        // 초기 호출
        updateViewport();
    </script>
