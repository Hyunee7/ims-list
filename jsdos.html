  <script>
    var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
    var no = params && params.get("no") && decodeURIComponent(params.get("no"));
    if(no){
        var file = no.split('.')[0];
        var ntmn = no.split('.')[1];
    }

    var dos;
    var _fs;
    var _main;

    no = no||'ocplay.1234567890'
    file = file||'ocplay'

    const showMobileUrlBar = () => {
      let i = 0
      const to = setInterval(() => {
        document.body.scrollTop = -1
        // clear timeout after 250 ms and reset scrollTop to 0
        if (i++ > 25) {
          clearInterval(to)
          document.body.scrollTop = 0
        }
      }, 10)
    }

    function SDL_Quit() { // 안됨
        console.log('-----------------------');
    }

    function run(v){
      dos = Dos(document.getElementById("jsdos"), {
//        wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
        wdosboxUrl: "wdosbox.js",
        cycles: 1000,
        //cycles: "max",
        autolock: true,
        nosound:false,
      }).ready(function (fs, main) {
          _fs=fs;
          _main=fs;
       fs.extract(`zip/${no}.zip`).then(function () {
        main(["-c", `\\${file}\\play.bat`]).then(function (ci) {
//            DosController.Move(ci.getParentDiv(), ci.getKeyEventConsumer());
//            DosController.Qwerty(ci.getParentDiv(), ci.getKeyEventConsumer());
            var msg='';
            window.ci = ci;
            // 이동 컨트롤러
            //DosController.Move(ci.getParentDiv(), ci.getKeyEventConsumer());
            // 쿼티 컨트롤러
            //DosController.Qwerty(ci.getParentDiv(), ci.getKeyEventConsumer());
            //ci.api.canvas.focus();
            ci.listenStdout(function (message) {

              if(message.charCodeAt(0)==10)msg=''; // 엔터문자 이후 문자수집(트래킹?용)
              else msg+=message;
              console.log(message, message.charCodeAt(0),msg)

              if(msg.indexOf('hyunee')>-1){ // 종료
                setTimeout(function () {
                  fetch(`${file}.php?no=${ntmn}`).then(res => {
                    ci.exit();
                    history.go(-1);
                  })
                }, 1000);
              }

              /*
              if (message.startsWith("C:\\OCPLAY")) {
                  console.log('test')
              }
              */

            });
/*
            window.ci = ci;
              setTimeout(function () {
                ci.exit();
              }, 1000)
*/

        });
       });
      });
    }
    window.onload = function(){
        run(location.href.split('?p=')[1]||'GAME');
        //jsdos.style.width='100%';
        //TweenMax.to(window, 0.5, {scrollTo: 0, onComplete: showMobileUrlBar})
        showMobileUrlBar();
    }

    let analyticsData = { no:no, file:file, ntmn:ntmn };

    window.addEventListener("unload", function() {
      navigator.sendBeacon(`${file}.php?no=${ntmn}`, JSON.stringify(analyticsData));
    });

    function keyboard(key){
        console.log('key:',key);
        //document.body.dispatchEvent(new KeyboardEvent('keydown', {'key': key}));
        jsdos.dispatchEvent(new KeyboardEvent('keydown', {'key': key}));
    }
  </script>
</head>

<body>
  <div class="mydosbox"><canvas id="jsdos" width="640px" height="480px"></canvas></div>
  <div class="qwerty-key"></div>

    <div class="qwerty-container" style="visibility: hidden;">
        <div>ENTER CHARS:</div>

        <div class="qwerty-input-row">
            <div>:&gt;&nbsp;</div>
            <input class="qwerty-input" value="" tabindex="1" style="width: 2ch;">
            <!-- <div class="qwerty-cursor"></div> -->
            <div class="qwerty-send">Send</div>
        </div>
    </div>

    <div id="k1" onclick="keyboard('1')">[ 1 ]</div>
</body>
